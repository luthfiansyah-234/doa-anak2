<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <title>Belajar Doa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7f4;--c:#fff;--t:#1d2b24;--m:#5b6b62;
--p:#1f7a54;--b:#d9e2dc;--ok:#d3f0df;--no:#f8d7d7
}
@media(prefers-color-scheme:dark){
    :root:not([data-theme=light]){--bg:#101814;--c:#18241e;--t:#e6efe9;--m:#9bb0a4;--p:#46b588;--b:#2a3b32;--ok:#1d4a33;--no:#552626}}

    *{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}

h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--m);margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.tab,.opt,.btn{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:10px;padding:10px 14px}
.tab{flex:1}.tab.on,.btn{background:var(--p);color:#fff;border-color:var(--p)}
input{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--b);background:var(--c);color:var(--m);border-radius:99px;padding:4px 12px;font-size:14px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
details{background:var(--c);border:1px solid var(--b);border-radius:12px;margin-bottom:8px;padding:0 14px}
summary{padding:12px 0;cursor:pointer;font-weight:600}
summary small{color:var(--m);font-weight:400;margin-left:6px}
.ar{font-family:Amiri,'Traditional Arabic',serif;font-size:28px;line-height:2;
    direction:rtl;text-align:right;margin:0}
    .mean{color:var(--m);padding-bottom:14px;margin:0}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px}
.modes{display:grid;gap:8px}
.modes .opt{text-align:left}
.opt{display:block;width:100%;text-align:left;margin-top:8px}
.opt.ok{background:var(--ok);border-color:var(--p)}
.opt.no{background:var(--no)}
.opt.arx{font-family:Amiri,serif;font-size:24px;text-align:center;direction:rtl}
.bar{color:var(--m);font-size:14px;display:flex;justify-content:space-between;margin-bottom:8px}
.blank{border-bottom:2px solid var(--p);padding:0 14px}
.hide{display:none}
</style>
</head>
<body>
    <main>
<h1>📖 Belajar Doa</h1>
<p class="sub" id="sub"></p>
<div class="tabs">
    <button class="tab on" data-v="learn">Belajar</button>
    <button class="tab" data-v="quiz">Kuis</button>
</div>

<section id="learn">
<input id="q" placeholder="Cari doa atau arti…">
<div class="chips" id="chips"></div>
<div id="list"></div>
</section>

<section id="quiz" class="hide">
<div id="menu" class="card"><b>Pilih jenis kuis (10 soal, tanpa suara)</b>
<div class="modes">
    <button class="opt" data-m="c">✍️ Lengkapi Doa — pilih kata Arab yang hilang</button>
    <button class="opt" data-m="a">🔎 Tebak Arti — dari teks Arab ke artinya</button>
    <button class="opt" data-m="t">🤲 Tebak Doa — dari arti ke nama doa</button>
</div>
</div>
<div id="play" class="card hide"></div>
</section>
</main>
<script>
// Format: [kategori, nama doa, teks Arab, arti]. Tambah doa baru di sini.
const D=[
["Harian","Sebelum makan","اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ","Ya Allah, berkahilah rezeki yang Engkau berikan kepada kami dan lindungilah kami dari siksa neraka."],
["Harian","Sesudah makan","الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ","Segala puji bagi Allah yang telah memberi kami makan dan minum serta menjadikan kami muslim."],
["Harian","Bangun tidur","الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ","Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami, dan kepada-Nya kami dikembalikan."],
["Harian","Sebelum tidur","بِاسْمِكَ اللَّهُمَّ أَحْيَا وَأَمُوتُ","Dengan nama-Mu ya Allah aku hidup dan aku mati."],
["Harian","Masuk kamar mandi","اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ","Ya Allah, aku berlindung kepada-Mu dari setan laki-laki dan setan perempuan."],
["Harian","Keluar kamar mandi","غُفْرَانَكَ","Aku memohon ampunan-Mu."],
["Harian","Keluar rumah","بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ","Dengan nama Allah, aku bertawakal kepada Allah; tiada daya dan kekuatan kecuali dengan pertolongan Allah."],
["Harian","Naik kendaraan","سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ","Maha Suci Allah yang menundukkan ini bagi kami padahal kami tidak mampu menguasainya, dan sesungguhnya kepada Tuhan kami kami akan kembali."],
["Harian","Memakai pakaian","الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","Segala puji bagi Allah yang memberiku pakaian ini dan rezeki tanpa daya dan kekuatan dariku."],
["Harian","Bercermin","اللَّهُمَّ أَنْتَ حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي","Ya Allah, Engkau telah memperindah penciptaanku, maka perindahlah akhlakku."],
["Harian","Ketika bersin","الْحَمْدُ لِلَّهِ","Segala puji bagi Allah."],
["Harian","Mendoakan orang bersin","يَرْحَمُكَ اللهُ","Semoga Allah merahmatimu."],
["Ibadah","Masuk masjid","اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu."],
["Ibadah","Keluar masjid","اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ","Ya Allah, aku memohon karunia-Mu."],
["Ibadah","Sesudah wudu","أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ","Aku bersaksi tiada tuhan selain Allah semata, tiada sekutu bagi-Nya, dan aku bersaksi Muhammad adalah hamba dan utusan-Nya."],
["Ibadah","Berbuka puasa","ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللهُ","Telah hilang dahaga, urat-urat telah basah, dan pahala telah tetap insya Allah."],
["Perlindungan","Kesedihan dan kegelisahan","اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ","Ya Allah, aku berlindung kepada-Mu dari kesusahan dan kesedihan."],
["Perlindungan","Perlindungan pagi dan petang","بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","Dengan nama Allah yang bersama nama-Nya tidak ada sesuatu pun di bumi dan langit yang membahayakan, dan Dia Maha Mendengar, Maha Mengetahui."],
["Perlindungan","Ketika tertimpa musibah","إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ","Sesungguhnya kami milik Allah dan kepada-Nya kami kembali."],
["Perlindungan","Hasbunallah","حَسْبُنَا اللهُ وَنِعْمَ الْوَكِيلُ","Cukuplah Allah bagi kami, dan Dialah sebaik-baik pelindung."],
["Perlindungan","Tidak berdaya tanpa Allah","لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ","Tiada daya dan kekuatan kecuali dengan pertolongan Allah."],
["Perlindungan","Rezeki halal","اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ","Ya Allah, cukupkanlah aku dengan yang halal dari yang haram, dan kayakanlah aku dengan karunia-Mu dari selain-Mu."],
["Al-Qur'an","Doa sapu jagat","رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","Ya Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan lindungilah kami dari siksa neraka."],
["Al-Qur'an","Untuk orang tua","رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","Ya Tuhanku, ampunilah aku dan kedua orang tuaku, sayangilah mereka sebagaimana mereka mendidikku waktu kecil."],
["Al-Qur'an","Menambah ilmu","رَبِّ زِدْنِي عِلْمًا","Ya Tuhanku, tambahkanlah ilmu kepadaku."],
["Al-Qur'an","Lapang dada","رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي","Ya Tuhanku, lapangkanlah dadaku dan mudahkanlah urusanku."],
["Al-Qur'an","Keteguhan hati","يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ","Wahai Pembolak-balik hati, teguhkanlah hatiku pada agama-Mu."],
["Al-Qur'an","Mohon ampunan","رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ","Ya Tuhan kami, kami telah menzalimi diri kami; jika Engkau tidak mengampuni dan merahmati kami, pastilah kami termasuk orang-orang yang rugi."],
["Al-Qur'an","Doa Nabi Yunus","لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ","Tiada tuhan selain Engkau, Maha Suci Engkau, sungguh aku termasuk orang-orang yang zalim."],
["Al-Qur'an","Keluarga dan keturunan","رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا","Ya Tuhan kami, anugerahkanlah kepada kami pasangan dan keturunan sebagai penyejuk mata, dan jadikanlah kami pemimpin bagi orang-orang yang bertakwa."],
["Harian","Masuk rumah","بِسْمِ اللهِ وَلَجْنَا وَبِسْمِ اللهِ خَرَجْنَا وَعَلَى رَبِّنَا تَوَكَّلْنَا","Dengan nama Allah kami masuk, dengan nama Allah kami keluar, dan kepada Tuhan kami, kami bertawakal."],
["Harian","Sebelum belajar","اللَّهُمَّ انْفَعْنِي بِمَا عَلَّمْتَنِي وَعَلِّمْنِي مَا يَنْفَعُنِي وَزِدْنِي عِلْمًا","Ya Allah, berilah aku manfaat atas apa yang Engkau ajarkan, ajarkan aku yang bermanfaat, dan tambahkan ilmu kepadaku."],
["Harian","Ketika turun hujan","اللَّهُمَّ صَيِّبًا نَافِعًا","Ya Allah, turunkanlah hujan yang bermanfaat."],
["Harian","Ketika marah","أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ","Aku berlindung kepada Allah dari setan yang terkutuk."],
["Harian","Memulai pekerjaan","بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ","Dengan nama Allah Yang Maha Pengasih, Maha Penyayang."],
["Harian","Membalas kebaikan orang","جَزَاكَ اللهُ خَيْرًا","Semoga Allah membalasmu dengan kebaikan."],
["Harian","Menjenguk orang sakit","لَا بَأْسَ طَهُورٌ إِنْ شَاءَ اللهُ","Tidak mengapa, semoga sakit ini menjadi penyuci dosa, insya Allah."],
["Harian","Memohon kesehatan","اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ","Ya Allah, aku memohon maaf dan kesehatan di dunia dan akhirat."],
["Harian","Saat merasa sakit","أَعُوذُ بِعِزَّةِ اللهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ","Aku berlindung dengan kemuliaan dan kekuasaan Allah dari keburukan apa yang kurasakan dan kukhawatirkan."],
["Ibadah","Bacaan rukuk","سُبْحَانَ رَبِّيَ الْعَظِيمِ","Maha Suci Tuhanku Yang Maha Agung."],
["Ibadah","Bacaan sujud","سُبْحَانَ رَبِّيَ الْأَعْلَى","Maha Suci Tuhanku Yang Maha Tinggi."],
["Ibadah","Duduk di antara dua sujud","رَبِّ اغْفِرْ لِي وَارْحَمْنِي وَاجْبُرْنِي وَارْفَعْنِي وَارْزُقْنِي وَاهْدِنِي وَعَافِنِي وَاعْفُ عَنِّي","Ya Tuhanku, ampunilah aku, rahmatilah aku, cukupkan kekuranganku, angkatlah derajatku, berilah rezeki dan petunjuk, sehatkan aku, dan maafkanlah aku."],
["Ibadah","Bangun dari rukuk (iktidal)","سَمِعَ اللهُ لِمَنْ حَمِدَهُ","Allah mendengar orang yang memuji-Nya."],
["Ibadah","Jawaban iktidal","رَبَّنَا لَكَ الْحَمْدُ","Ya Tuhan kami, bagi-Mu segala puji."],
["Ibadah","Sesudah azan","اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ","Ya Allah, Tuhan seruan yang sempurna ini dan salat yang akan didirikan, berilah Muhammad wasilah dan keutamaan, dan bangkitkan ia pada kedudukan terpuji yang Engkau janjikan."],
["Ibadah","Shalawat","اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ","Ya Allah, limpahkanlah rahmat kepada Muhammad dan keluarga Muhammad."],
["Ibadah","Istigfar","أَسْتَغْفِرُ اللهَ الْعَظِيمَ","Aku memohon ampun kepada Allah Yang Maha Agung."],
["Ibadah","Zikir tasbih dan tahmid","سُبْحَانَ اللهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللهُ وَاللهُ أَكْبَرُ","Maha Suci Allah, segala puji bagi Allah, tiada tuhan selain Allah, dan Allah Maha Besar."],
["Ibadah","Malam Lailatul Qadar","اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي","Ya Allah, sesungguhnya Engkau Maha Pemaaf dan menyukai maaf, maka maafkanlah aku."],
["Ibadah","Setelah salat","اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ","Ya Allah, bantulah aku untuk berzikir, bersyukur, dan beribadah dengan baik kepada-Mu."],
["Perlindungan","Berlindung dari lemah dan malas","اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ","Ya Allah, aku berlindung kepada-Mu dari kelemahan dan kemalasan."],
["Perlindungan","Memohon petunjuk dan kecukupan","اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى","Ya Allah, aku memohon petunjuk, ketakwaan, kesucian diri, dan kecukupan."],
["Perlindungan","Memohon kemudahan","اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا","Ya Allah, tidak ada kemudahan kecuali yang Engkau jadikan mudah."],
["Al-Qur'an","Mohon amal diterima","رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ","Ya Tuhan kami, terimalah amal dari kami; sungguh Engkaulah Yang Maha Mendengar, Maha Mengetahui."],
["Al-Qur'an","Hati tidak menyimpang","رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ","Ya Tuhan kami, jangan condongkan hati kami setelah Engkau beri petunjuk, dan anugerahkan rahmat dari sisi-Mu; sungguh Engkau Maha Pemberi."],
["Al-Qur'an","Kesabaran dan keteguhan","رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","Ya Tuhan kami, limpahkanlah kesabaran kepada kami, kokohkan langkah kami, dan tolonglah kami menghadapi kaum yang kafir."],
["Al-Qur'an","Lupa dan salah","رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا","Ya Tuhan kami, janganlah Engkau hukum kami jika kami lupa atau salah."],
["Al-Qur'an","Doa Nabi Musa","رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ","Ya Tuhanku, sungguh aku sangat membutuhkan kebaikan apa pun yang Engkau turunkan kepadaku."],
["Al-Qur'an","Doa Nabi Ibrahim","رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ","Ya Tuhanku, jadikanlah aku dan keturunanku orang yang mendirikan salat. Ya Tuhan kami, kabulkanlah doaku."],
["Al-Qur'an","Cukuplah Allah bagiku","حَسْبِيَ اللهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","Cukuplah Allah bagiku, tiada tuhan selain Dia; kepada-Nya aku bertawakal, dan Dia Tuhan Arsy yang agung."],
["Al-Qur'an","Dari bisikan setan","رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ","Ya Tuhanku, aku berlindung kepada-Mu dari bisikan-bisikan setan."],
["Al-Qur'an","Bersyukur atas nikmat","رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ","Ya Tuhanku, ilhamkanlah aku untuk mensyukuri nikmat-Mu yang telah Engkau berikan kepadaku dan kepada kedua orang tuaku."],
["Al-Qur'an","Ampunan untuk mukmin","رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ","Ya Tuhan kami, ampunilah aku, kedua orang tuaku, dan semua orang mukmin pada hari terjadinya perhitungan."],
["Al-Qur'an","Kami beriman","رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنْتَ خَيْرُ الرَّاحِمِينَ","Ya Tuhan kami, kami beriman, maka ampunilah kami dan rahmatilah kami; Engkaulah pemberi rahmat yang terbaik."]
];
const $=s=>document.querySelector(s),
sh=a=>[...a].sort(()=>Math.random()-.5);
$('#sub').textContent=D.length+' doa lengkap dengan teks Arab dan artinya, plus kuis.';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==b));
    $('#learn').classList.toggle('hide',b.dataset.v!='learn');
    $('#quiz').classList.toggle('hide',b.dataset.v!='quiz')
});
let cat='Semua';
const cats=['Semua',...new Set(D.map(d=>d[0]))];
function chips(){$('#chips').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${c}">${c}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;chips();list()})
}
function list(){const k=$('#q').value.toLowerCase();
$('#list').innerHTML=D.map((d,i)=>[d,i])
.filter(([d])=>(cat=='Semua'||d[0]==cat)&&(d[1]+d[3]).toLowerCase().includes(k))
.map(([d,i])=>`<details><summary>${i+1}. ${d[1]}<small>${d[0]}</small></summary>
    <p class="ar">${d[2]}</p><p class="mean">${d[3]}</p></details>`).join('')
||'<p class="sub">Tidak ditemukan.</p>'
}
$('#q').oninput=list;chips();list();
let Q=[],i=0,sc=0;
const clean=w=>w.replace(/[\u064B-\u0652\u0670]/g,'');
function build(m){
    const pool=m=='c'?D.filter(d=>d[2].split(' ').length>=3):D;
    return sh(pool).slice(0,10).map(d=>{
        const o=sh(D.filter(x=>x!=d));
        if(m=='a'){
            return {p:`<p class="ar">${d[2]}</p><p>Apa artinya?</p>`,o:[d[3],...o.slice(0,3).map(x=>x[3])],a:d[3]};
        }
        if(m=='t'){
            return {p:`<p>Doa manakah yang artinya:</p><p><i>${d[3]}</i></p>`,
                o:[d[1],...o.slice(0,3).map(x=>x[1])],a:d[1]};
        }
        const w=d[2].split(' '),
        c=w.map((x,j)=>j).filter(j=>clean(w[j]).length>2),
        k=c[Math.floor(Math.random()*c.length)],
        ans=w[k];
        const alt=sh([...new Set(D.flatMap(x=>x[2].split(' '))
        .filter(x=>clean(x).length>2&&clean(x)!=clean(ans)))]).slice(0,3);
        const t=w.map((x,j)=>j==k?'<span class="blank">&nbsp;&nbsp;&nbsp;</span>':x).join(' ');
        return {p:`<p>Lengkapi doa <b>${d[1]}</b>:</p><p class="ar">${t}</p>`,o:[ans,...alt],a:ans,ar:1};
    });
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    Q=build(b.dataset.m);i=0;sc=0;
    $('#menu').classList.add('hide');
    $('#play').classList.remove('hide');
    show()
});
function show(){if(i>=Q.length){
    const pct=sc/Q.length;
    $('#play').innerHTML=`<h2>Skor: ${sc} / ${Q.length}</h2><p>${pct>=.8?'Masya Allah, hebat! 🌟':pct>=.5?'Bagus, terus berlatih! 💪':'Ayo ulangi dan pelajari lagi 📖'}</p><button class="btn" id="again">Kuis lagi</button>`;$('#again').onclick=()=>{$('#play').classList.add('hide');$('#menu').classList.remove('hide')};return}
const q=Q[i];
$('#play').innerHTML=`<div class="bar"><span>Soal ${i+1}/${Q.length}</span><span>Benar: ${sc}</span></div>
${q.p}<div id="o">${sh(q.o).map(x=>`<button class="opt ${q.ar?'arx':''}">${x}</button>`).join('')}</div>
<div id="nx">
    </div>`;
document.querySelectorAll('#o .opt').forEach(b=>b.onclick=()=>{const r=b.innerHTML==q.a;if(r)sc++;document.querySelectorAll('#o .opt').forEach(x=>{x.disabled=true;if(x.innerHTML==q.a)x.classList.add('ok')});if(!r)b.classList.add('no');$('#nx').innerHTML='<button class="btn" style="margin-top:12px" id="n">'+(i==Q.length-1?'Lihat skor':'Lanjut')+'</button>';$('#n').onclick=()=>{i++;show()}})}
</script>
</body>
</html>
